<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Notes Summarizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
      --accent: #7c6aff;
      --accent2: #ff6a9b;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --success: #4ade80;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(124,106,255,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 10% 90%, rgba(255,106,155,0.08) 0%, transparent 60%);
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeUp 0.6s ease both;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(124,106,255,0.3);
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 70%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.6rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.03em;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.2rem;
      animation: fadeUp 0.6s ease both;
    }

    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }

    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .label::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    textarea {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      padding: 1rem;
      resize: vertical;
      min-height: 180px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder { color: var(--muted); }

    .options-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .chip {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      padding: 0.4rem 0.9rem;
      border-radius: 2rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }

    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active {
      background: rgba(124,106,255,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .api-row {
      display: flex;
      gap: 0.6rem;
    }

    input[type="password"], input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      padding: 0.7rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }

    .btn {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      padding: 0.75rem 1.8rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
      margin-top: 1rem;
      font-size: 0.9rem;
      padding: 0.9rem;
    }

    .btn-primary:hover:not(:disabled) {
      background: #6a58f0;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(124,106,255,0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-sm {
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 0.72rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
    }

    .btn-sm:hover { color: var(--text); border-color: var(--muted); }

    .result-box {
      display: none;
      animation: fadeUp 0.4s ease both;
    }

    .result-box.visible { display: block; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .result-content {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem;
      font-size: 0.83rem;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      min-height: 100px;
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 1rem 0;
    }

    .dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
      margin: 0 2px;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    .error {
      color: var(--accent2);
      font-size: 0.8rem;
      padding: 0.8rem 1rem;
      background: rgba(255,106,155,0.08);
      border: 1px solid rgba(255,106,155,0.2);
      border-radius: 8px;
      margin-top: 0.8rem;
      display: none;
    }

    .char-count {
      text-align: right;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.7rem;
      margin-top: 2rem;
      letter-spacing: 0.05em;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">✦ Powered by Claude API</div>
    <h1>AI Notes Summarizer</h1>
    <p class="subtitle">Paste your notes. Get clean, structured summaries instantly.</p>
  </header>

  <!-- API Key -->
  <div class="card">
    <div class="label">API Key</div>
    <div class="api-row">
      <input type="password" id="apiKey" placeholder="sk-ant-api03-..." />
    </div>
  </div>

  <!-- Notes Input -->
  <div class="card">
    <div class="label">Your Notes</div>
    <textarea id="notesInput" placeholder="Paste your notes here... lecture notes, textbook content, any text you want summarized."></textarea>
    <div class="char-count"><span id="charCount">0</span> characters</div>

    <div class="options-row">
      <span style="font-size:0.7rem; color:var(--muted); align-self:center;">Summary style:</span>
      <button class="chip active" data-mode="concise">Concise</button>
      <button class="chip" data-mode="detailed">Detailed</button>
      <button class="chip" data-mode="bullets">Bullet Points</button>
      <button class="chip" data-mode="exam">Exam Ready</button>
    </div>

    <button class="btn btn-primary" id="summarizeBtn" onclick="summarize()">
      ✦ Summarize Notes
    </button>
    <div class="error" id="errorBox"></div>
  </div>

  <!-- Result -->
  <div class="card result-box" id="resultBox">
    <div class="result-header">
      <div class="label">Summary</div>
      <button class="btn btn-sm" onclick="copyResult()">⎘ Copy</button>
    </div>
    <div class="loader" id="loader">
      <div class="dots"><span></span><span></span><span></span></div>
      Generating summary...
    </div>
    <div class="result-content" id="resultContent" style="display:none;"></div>
  </div>

  <div class="footer">Built with HTML · JS · Claude API &nbsp;|&nbsp; Project by Priyanka</div>
</div>

<script>
  let selectedMode = 'concise';

  // Chip selection
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedMode = chip.dataset.mode;
    });
  });

  // Char count
  document.getElementById('notesInput').addEventListener('input', function() {
    document.getElementById('charCount').textContent = this.value.length;
  });

  const prompts = {
    concise: "Summarize the following notes in a concise, clear paragraph. Capture the key ideas only.",
    detailed: "Provide a detailed summary of the following notes. Cover all main points, sub-points, and important details.",
    bullets: "Summarize the following notes as clean bullet points. Each bullet should be one key idea. Use — as bullet symbol.",
    exam: "Convert these notes into an exam-ready summary. Highlight key terms, definitions, and important concepts a student should remember."
  };

  async function summarize() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const notes = document.getElementById('notesInput').value.trim();
    const btn = document.getElementById('summarizeBtn');
    const errorBox = document.getElementById('errorBox');
    const resultBox = document.getElementById('resultBox');
    const loader = document.getElementById('loader');
    const resultContent = document.getElementById('resultContent');

    errorBox.style.display = 'none';

    if (!apiKey) { showError('Please enter your Claude API key.'); return; }
    if (!notes) { showError('Please paste some notes to summarize.'); return; }

    btn.disabled = true;
    btn.textContent = 'Summarizing...';
    resultBox.classList.add('visible');
    loader.style.display = 'flex';
    resultContent.style.display = 'none';
    resultContent.textContent = '';

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: `${prompts[selectedMode]}\n\n---\n${notes}\n---`
          }]
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || 'API error occurred.');
      }

      const summary = data.content[0].text;
      loader.style.display = 'none';
      resultContent.style.display = 'block';
      resultContent.textContent = summary;

    } catch (err) {
      loader.style.display = 'none';
      resultBox.classList.remove('visible');
      showError('Error: ' + err.message);
    }

    btn.disabled = false;
    btn.textContent = '✦ Summarize Notes';
  }

  function showError(msg) {
    const errorBox = document.getElementById('errorBox');
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  function copyResult() {
    const text = document.getElementById('resultContent').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      btn.textContent = '✓ Copied!';
      setTimeout(() => btn.textContent = '⎘ Copy', 2000);
    });
  }
</script>
</body>
</html>
